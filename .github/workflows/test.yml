name: Test, scan, and publish
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fastapi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fastapi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastapi_test
      SECRET_KEY: ci-only-signing-key-with-more-than-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Unit, PostgreSQL integration, and browser tests
        run: pytest --run-slow --junitxml=test-results/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results/
            htmlcov/
  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image once
        run: docker build --pull -t secure-users:test .
      - name: Scan image (fail on fixable high or critical vulnerabilities)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: secure-users:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Smoke test the image against PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name smoke-db --network smoke -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=fastapi_db postgres:17
          trap 'docker logs smoke-app || true; docker rm -f smoke-app smoke-db || true' EXIT
          for i in {1..30}; do
            if docker exec smoke-db pg_isready -U postgres -d fastapi_db; then break; fi
            sleep 2
          done
          docker run -d --name smoke-app --network smoke -p 8000:8000 -e DATABASE_URL=postgresql://postgres:postgres@smoke-db:5432/fastapi_db -e SECRET_KEY=smoke-test-signing-key-at-least-32-characters secure-users:test
          curl --retry 20 --retry-delay 2 --retry-connrefused --fail http://localhost:8000/health
          curl --fail -H 'Content-Type: application/json' -d '{"username":"smokeuser","email":"smoke@example.com","password":"TestPass123!"}' http://localhost:8000/users
      - name: Save tested image
        run: docker save secure-users:test -o /tmp/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: tested-image
          path: /tmp/image.tar
          retention-days: 1
  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
    steps:
      - name: Check deployment configuration
        run: test -n "$DOCKERHUB_REPOSITORY" || (echo 'Set DOCKERHUB_REPOSITORY to username/repository in repository variables'; exit 1)
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
          path: /tmp
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the exact tested and scanned image
        run: |
          docker load -i /tmp/image.tar
          docker tag secure-users:test "$DOCKERHUB_REPOSITORY:latest"
          docker tag secure-users:test "$DOCKERHUB_REPOSITORY:${{ github.sha }}"
          docker push "$DOCKERHUB_REPOSITORY:latest"
          docker push "$DOCKERHUB_REPOSITORY:${{ github.sha }}"
